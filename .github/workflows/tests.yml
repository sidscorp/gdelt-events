name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run offline test suite
        run: python -m pytest tests/ -m "not live"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lint.txt

      # Lint only, no formatter: ruff.toml selects a narrow set of rules that
      # is already clean across the tree, so this fails only on new defects.
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lint.txt

      - name: Lint
        run: ruff check .
