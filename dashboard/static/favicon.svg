<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Globe outline -->
  <circle cx="16" cy="16" r="13" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Latitude lines -->
  <ellipse cx="16" cy="16" rx="13" ry="5" fill="none" stroke="#1a1a1a" stroke-width="0.8" opacity="0.7"/>
  <!-- Longitude line -->
  <ellipse cx="16" cy="16" rx="5" ry="13" fill="none" stroke="#1a1a1a" stroke-width="0.8" opacity="0.7"/>
  <!-- Equator -->
  <line x1="3" y1="16" x2="29" y2="16" stroke="#1a1a1a" stroke-width="0.8" opacity="0.7"/>
  <!-- Prime meridian -->
  <line x1="16" y1="3" x2="16" y2="29" stroke="#1a1a1a" stroke-width="0.8" opacity="0.7"/>
  <!-- Live signal dot -->
  <circle cx="22" cy="9" r="3" fill="#b87300"/>
  <circle cx="22" cy="9" r="3" fill="none" stroke="#b87300" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
